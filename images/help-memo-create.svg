<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc">
  <title id="title">メモを作る</title>
  <desc id="desc">タイトル、本文、タグ、リマインダー、保存ボタンがあるメモ入力画面。</desc>
  <rect width="480" height="270" rx="18" fill="#f7f5f0"/>
  <rect x="56" y="28" width="368" height="214" rx="14" fill="#ffffff" stroke="#dedbd2"/>
  <text x="80" y="58" fill="#0f766e" font-family="Segoe UI, Yu Gothic UI, Meiryo, Arial, sans-serif" font-size="13" font-weight="800">MEMO DESK</text>
  <rect x="80" y="76" width="320" height="34" rx="8" fill="#fffefb" stroke="#dedbd2"/>
  <text x="98" y="98" fill="#67706f" font-family="Segoe UI, Yu Gothic UI, Meiryo, Arial, sans-serif" font-size="13">タイトル</text>
  <rect x="80" y="122" width="320" height="66" rx="8" fill="#fffefb" stroke="#dedbd2"/>
  <path d="M100 144h220M100 164h168" stroke="#d7d1c7" stroke-width="7" stroke-linecap="round"/>
  <rect x="80" y="202" width="190" height="32" rx="8" fill="#fffefb" stroke="#dedbd2"/>
  <text x="98" y="223" fill="#67706f" font-family="Segoe UI, Yu Gothic UI, Meiryo, Arial, sans-serif" font-size="13">タグ</text>
  <rect x="282" y="202" width="118" height="32" rx="8" fill="#0f766e"/>
  <text x="320" y="223" fill="#ffffff" font-family="Segoe UI, Yu Gothic UI, Meiryo, Arial, sans-serif" font-size="13" font-weight="800">保存</text>
  <circle cx="380" cy="90" r="28" fill="#edf7f5" stroke="#7ac8bd"/>
  <path d="M371 91l7 7 15-18" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
