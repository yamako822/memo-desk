<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <meta name="description" content="メモを整理する">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Memo Desk">
    <title>Memo Desk</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <section id="loginScreen" class="login-screen" aria-labelledby="login-title">
      <div class="login-card">
        <p class="eyebrow">Memo Desk</p>
        <h1 id="login-title">ログイン</h1>
        <p class="login-note">アカウントごとにメモが分かれます。別のPCから同じアカウントでログインすると、同じメモが表示されます。</p>
        <div class="login-form">
          <p class="form-error" id="loginError" hidden></p>

          <button type="button" class="google-login-button" id="googleLoginButton">
            Google でログイン
          </button>

          <p class="auth-divider" aria-hidden="true"><span>または</span></p>

          <div class="email-auth">
            <div class="auth-mode-toggle" role="tablist" aria-label="メール認証のモード">
              <button type="button" class="active" id="emailSignInTab" role="tab" aria-selected="true">ログイン</button>
              <button type="button" id="emailSignUpTab" role="tab" aria-selected="false">新規登録</button>
            </div>
            <form id="emailAuthForm" novalidate>
              <label for="emailInput">メールアドレス</label>
              <input id="emailInput" type="email" autocomplete="email" placeholder="example@mail.com" required>
              <label for="passwordInput">パスワード（6文字以上）</label>
              <input id="passwordInput" type="password" autocomplete="current-password" minlength="6" placeholder="******" required>
              <button type="submit" id="emailSubmitButton">メールでログイン</button>
            </form>
          </div>

          <p class="login-hint" id="loginHint" hidden>処理中…</p>
        </div>
      </div>
    </section>

    <main id="appScreen" class="app" hidden>
      <p class="app-loading" id="appLoading" hidden>メモを読み込み中…</p>

      <section class="editor" aria-labelledby="editor-title">
        <div class="app-header">
          <div>
            <p class="eyebrow">Memo Desk</p>
            <h1 id="editor-title">メモを整理する</h1>
          </div>
          <div class="header-actions">
            <span class="user-badge" id="userGreeting"></span>
            <span class="count" id="memoCount">0件</span>
            <button type="button" class="secondary" id="logoutButton">ログアウト</button>
          </div>
        </div>

        <form id="memoForm" class="memo-form" novalidate>
          <p class="form-error" id="formError" hidden></p>
          <input id="memoTitle" type="text" placeholder="タイトル" autocomplete="off" aria-required="true">
          <textarea id="memoBody" rows="8" placeholder="本文を書いてください" aria-required="true"></textarea>
          <input id="memoTags" type="text" placeholder="タグ（例: 勉強, アイデア）" autocomplete="off">
          <div class="form-actions">
            <button type="button" class="secondary" id="clearButton">クリア</button>
            <button type="submit" id="saveButton">保存する</button>
          </div>
        </form>
      </section>

      <section class="library" aria-labelledby="library-title">
        <div class="toolbar">
          <h2 id="library-title">メモ一覧</h2>
          <input id="searchInput" type="search" placeholder="検索">
        </div>

        <div class="tag-filter" id="tagFilter" aria-label="タグで絞り込み"></div>
        <div class="memo-list" id="memoList"></div>
      </section>
    </main>

    <template id="memoTemplate">
      <article class="memo-card">
        <div class="memo-card-header">
          <h3></h3>
          <time></time>
        </div>
        <p class="memo-body"></p>
        <div class="memo-tags"></div>
        <div class="card-actions">
          <button type="button" class="secondary edit-button">編集</button>
          <button type="button" class="danger delete-button">削除</button>
        </div>
      </article>
    </template>

    <script type="module" src="app.js"></script>
    <script src="pwa.js"></script>
  </body>
</html>
