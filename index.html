<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <meta name="description" content="Memo Desk にログイン">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Memo Desk">
    <title>Memo Desk | Login</title>
    <link rel="manifest" href="manifest.webmanifest?v=9">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="styles.css?v=9">
  </head>
  <body>
    <section id="loginScreen" class="login-screen" aria-labelledby="login-title">
      <div class="login-card">
        <p class="eyebrow">Memo Desk</p>
        <h1 id="login-title">ログイン</h1>
        <p class="login-note">アカウントごとにメモが分かれます。別のPCから同じアカウントでログインすると、同じメモが表示されます。</p>
        <div class="login-form">
          <p class="form-error" id="loginError" hidden></p>

          <button type="button" class="google-login-button" id="googleLoginButton">
            Google でログイン
          </button>

          <p class="auth-divider" aria-hidden="true"><span>または</span></p>

          <div class="email-auth">
            <div class="auth-mode-toggle" role="tablist" aria-label="メール認証のモード">
              <button type="button" class="active" id="emailSignInTab" role="tab" aria-selected="true">ログイン</button>
              <button type="button" id="emailSignUpTab" role="tab" aria-selected="false">新規登録</button>
            </div>
            <form id="emailAuthForm" novalidate>
              <label for="emailInput">メールアドレス</label>
              <input id="emailInput" type="email" autocomplete="email" placeholder="example@mail.com" required>
              <label for="passwordInput">パスワード（6文字以上）</label>
              <input id="passwordInput" type="password" autocomplete="current-password" minlength="6" placeholder="******" required>
              <button type="submit" id="emailSubmitButton">メールでログイン</button>
            </form>
          </div>

          <p class="auth-divider" aria-hidden="true"><span>このPCだけ</span></p>

          <button type="button" class="secondary local-mode-button" id="localModeButton">
            ログインせずに使う
          </button>
          <p class="login-note local-mode-note">このモードのメモはこのブラウザ内だけに保存され、別PCとは同期されません。</p>

          <p class="login-hint" id="loginHint" hidden>処理中…</p>
        </div>
      </div>
    </section>

    <script>
      if (window.location.protocol === "file:") {
        window.addEventListener("DOMContentLoaded", () => {
          const message = "この画面はファイルを直接開くとログインできません。公開URLまたは http://localhost 経由で開いてください。";
          const loginError = document.querySelector("#loginError");
          const googleLoginButton = document.querySelector("#googleLoginButton");
          const emailAuthForm = document.querySelector("#emailAuthForm");
          const localModeButton = document.querySelector("#localModeButton");

          loginError.textContent = message;
          loginError.hidden = false;

          googleLoginButton.addEventListener("click", () => {
            alert(message);
          });

          emailAuthForm.addEventListener("submit", (event) => {
            event.preventDefault();
            alert(message);
          });

          localModeButton.addEventListener("click", () => {
            alert(message);
          });
        });
      }
    </script>
    <script type="module" src="app.js?v=9"></script>
    <script src="pwa.js?v=9"></script>
  </body>
</html>
